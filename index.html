<!doctype html>
<html lang="en">
<head>

<body>
<!-- The game renders into this canvas; all UI lives in #ui as DOM overlays. -->
<canvas class="game" id="game"></canvas>
<div id="ui"></div>
<div class="touch" id="touch">
  <div class="pad"><b style="left:33%;top:0" data-key="KeyW"></b><b style="left:0;top:33%" data-key="KeyA"></b><b style="left:66%;top:33%" data-key="KeyD"></b><b style="left:33%;top:66%" data-key="KeyS"></b></div>
  <div class="jump" data-key="Space"></div>
  <div class="tbar">
    <b data-key="Escape">II</b><b data-key="KeyE">INV</b><b data-key="F5">CAM</b><b data-wheel="-1">&lt;</b><b data-wheel="1">&gt;</b><b data-key="ShiftLeft">SNK</b>
  </div>
</div>
<script type="module" src="src/main.js?v=3"></script>
